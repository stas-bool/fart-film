<!doctype html>
<meta charset="utf-8">
<title>Поцелуй Посейдона · pencil comedy study</title>
<style>body{margin:0;background:#242321;display:grid;place-items:center;min-height:100vh}canvas{max-width:100vw;max-height:100vh;object-fit:contain}</style>
<canvas id="c"></canvas>
<script src="core.js"></script>
<script src="studio.js"></script>
<script src="cels.js"></script>
<script>
'use strict';
// ─────────────────────────────────────────────────────────────────────────────
// БРИФ
// Сюжет по гифке «El beso de Poseidón». Какашка выходит, отрывается и летит
// вниз (камера едет следом), плюхается в воду — корона брызг, круги, бульки.
// Вода вздувается, бьёт струёй — и из неё встаёт водяной Посейдон: тянет
// губы, целует попу, довольно ухмыляется и «викторией» щекочет яички —
// по пальцу на каждое. Склейка: лицо сидящего — блаженство → шок. Склейка:
// Посейдон в короне, величаво подмигивает и уходит в глубину.
// Длительность ~11.3 с; 16:9; 1920x1080. Look: pencil + акварельные заливки
// (цвет из гифки: кремовая бумага, голубая вода, розовая кожа, бирюза в финале).
// Техника: целые позы-селы на экспозиционных листах, без ригов; заливки —
// авторские формы под карандашом (drawCel рисует только штрихи). Корень
// персонажа и камера — отдельные дорожки. Все случайности сеяны.
// Звук: Web Audio — натуга, шлёп-отрыв, свист падения, плюх, капли, бульки,
// струя, арфа, чмок, «буп»-щекотка, шок-аккорд, медные фанфары, пузыри.
// ─────────────────────────────────────────────────────────────────────────────
const INK = '#423930';
const pressure = [[0,.1],[.14,.75],[.4,1],[.72,.62],[1,.06]];
const C = {
  paper: '#f5f0e5', skin: '#efb5a2', skinLine: '#6e4038',
  poop: '#8a5734', poopLine: '#3e2717',
  water: '#5cbde6', waterLine: '#1f4f6e', foam: '#ffffff',
  face: '#f3cdb0', hair: '#6b4a34', shirt: '#fbfaf6', pink: '#f1cbe9',
  deep: '#1d5c6c', deepLine: '#0c2b33', king: '#66cdf0',
};

// ── Геометрия ────────────────────────────────────────────────────────────────
const mirror = pts => pts.map(([x, y]) => [-x, y]);
const shift = (pts, dx, dy, s = 1) => pts.map(([x, y]) => [x * s + dx, y * s + dy]);
const ring = (cx, cy, rx, ry = rx, n = 10) => Array.from({ length: n }, (_, k) => { const a = -Math.PI / 2 + k * TAU / n; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
// волнистая прядь от (x0,y0) до (x1,y1)
function strand(x0, y0, x1, y1, amp, waves = 1.4, ph = 0, n = 9) {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L, p = [];
  for (let k = 0; k <= n; k++) { const u = k / n, o = amp * Math.sin(u * TAU * waves + ph) * Math.min(1, u * 3); p.push([x0 + dx * u + nx * o, y0 + dy * u + ny * o]); }
  return p;
}
// капля остриём вверх, повёрнутая на rot
function teardrop(x, y, s, rot = 0) {
  const p = [[0, -1.9 * s]];
  for (let k = 0; k <= 8; k++) { const a = -Math.PI / 6 + k / 8 * Math.PI * 4 / 3; p.push([s * Math.cos(a), s * Math.sin(a)]); }
  const c = Math.cos(rot), sn = Math.sin(rot);
  return p.map(([px, py]) => [x + px * c - py * sn, y + px * sn + py * c]);
}
// волнистый контур: ресемплинг + синусоида по нормали (вода, борода)
function wavify(pts, amp, period = 60, ph = 0, close = true) {
  const out = [], n = pts.length, segs = close ? n : n - 1; let d = 0;
  for (let i = 0; i < segs; i++) {
    const a = pts[i], b = pts[(i + 1) % n], L = Math.hypot(b[0] - a[0], b[1] - a[1]), m = Math.max(1, Math.round(L / 22)), nx = -(b[1] - a[1]) / L, ny = (b[0] - a[0]) / L;
    for (let k = 0; k < m; k++) { const u = k / m, o = amp * Math.sin((d + L * u) / period * TAU + ph); out.push([a[0] + (b[0] - a[0]) * u + nx * o, a[1] + (b[1] - a[1]) * u + ny * o]); }
    d += L;
  }
  if (!close) out.push(pts[n - 1].slice());
  return out;
}

// ── Рисунок = заливки (авторские формы) + карандашный сел ────────────────────
// fills: {pts, color, al, corner}; strokes: как в cels.js, цвет по умолчанию — line.
const D = {};
function drawing(id, { fills = [], strokes = [], line = INK }) {
  const cel = compileCel({ strokes: strokes.map(s => ({ pressure, width: 4, opacity: .95, ...s })) }, { id });
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of [...fills.flatMap(f => f.pts), ...strokes.flatMap(s => s.points)]) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
  D[id] = { id, fills, cel, line, box: [x0 - 24, y0 - 24, x1 - x0 + 48, y1 - y0 + 48] };
  return D[id];
}
const ln = (id, points, width = 4, opacity = .95, extra = {}) => ({ id, points, width, opacity, ...extra });

// ── Спрайты: конечный набор рисунков, кэш по id/scale ────────────────────────
const SS = 1.6, sprites = new Map();
function sprite(id) {
  const key = id + '/' + S;
  if (!sprites.has(key)) {
    const d = D[id]; if (!d) throw new Error('no drawing ' + id);
    const [bx, by, bw, bh] = d.box, cv = document.createElement('canvas');
    cv.width = Math.ceil(bw * S * SS); cv.height = Math.ceil(bh * S * SS);
    const g = cv.getContext('2d');
    g.scale(S * SS, S * SS); g.translate(-bx, -by);
    d.fills.forEach((f, k) => {
      const path = curvePath(f.pts, true, f.corner ?? 1.1);
      g.save(); g.globalAlpha = f.al ?? .94; g.fillStyle = f.color; g.fill(path); g.restore();
      wash(g, path, shade(f.color, .18), { al: .45, off: 3, seed: strokeSeed(id) % 997 + k, blend: 'source-over' });
    });
    // два прохода одного и того же села: линия плотнее, метки те же
    drawCel(g, d.cel, { material: 'pencil', color: d.line }); drawCel(g, d.cel, { material: 'pencil', color: d.line, opacity: .8 });
    sprites.set(key, cv);
  }
  return sprites.get(key);
}
function drawSpr(c, id, x = 0, y = 0, o = {}) {
  const { alpha = 1, scale = 1, rot = 0 } = o, s = sprite(id), [bx, by, bw, bh] = D[id].box;
  c.save(); c.globalAlpha *= alpha; c.translate(x, y); c.rotate(rot); c.scale(scale, scale);
  c.drawImage(s, bx, by, bw, bh); c.restore();
}
// последовательность рисунков: [[id, кадры], …] → экспозиционный лист
const seq = rows => exposureSheet(rows.map(([id, frames]) => ({ id, frames })), D, 24);
const grainOver = (c, seed, al = .05) => grain(c, rectPath(0, 0, W, H), [0, 0, W, H], 1600, '#3b3026', al, seed, 1.6);

// ═════════════════════════════════════════════════════════════════════════════
// РИСУНКИ
// ═════════════════════════════════════════════════════════════════════════════

// Попа снизу: две щеки свисают, между ними складка; (0,0) — точка выхода.
(() => {
  const L = [[-1250, -300], [-1040, -70], [-780, 70], [-520, 128], [-290, 116], [-130, 70], [-34, 18], [0, 0]];
  const R = mirror(L).reverse();
  drawing('butt', {
    line: C.skinLine,
    fills: [{ pts: [...L, ...R.slice(1), [1250, -760], [-1250, -760]], color: C.skin, corner: .6 }],
    strokes: [
      ln('cheekL', L, 6.5, .95, { corner: 1.4 }), ln('cheekR', R, 6.5, .95, { corner: 1.4 }),
      ln('crease', [[0, -4], [6, -70], [-4, -150], [3, -240]], 3.4, .7),
      ln('dimpleL', [[-420, -60], [-380, -40], [-340, -58]], 2.4, .4), ln('dimpleR', [[420, -60], [380, -40], [340, -58]], 2.4, .4),
      ln('roundL', [[-700, -10], [-560, 40], [-380, 58]], 2.6, .35), ln('roundR', [[700, -10], [560, 40], [380, 58]], 2.6, .35),
    ],
  });
})();

// Какашка: колбаска с перетяжками. (0,0) — верх; attached — срез под попой.
function poop(id, Lp, { attached = true, sx = 1, sy = 1 } = {}) {
  const R = 27 * sx, n = Math.max(8, Math.round(Lp / 14)), left = [], right = [], cx = y => 7 * Math.sin(y / Lp * 3.2 + .5) * Math.min(1, Lp / 140);
  const hw = y => {
    let w = R * (1 + .09 * Math.sin(y / 26 * Math.PI));
    if (y > Lp - R) w *= Math.sqrt(Math.max(0, 1 - ((y - (Lp - R)) / R) ** 2));
    if (!attached && y < R) w *= Math.sqrt(Math.max(0, 1 - ((R - y) / R) ** 2));
    return w;
  };
  for (let k = 0; k <= n; k++) { const y = k / n * Lp; left.push([cx(y) - hw(y), y * sy]); right.push([cx(y) + hw(y), y * sy]); }
  const contour = attached ? [...left, ...right.slice(0, -1).reverse()] : [...left, ...right.slice(1, -1).reverse()];
  const strokes = [ln('contour', contour, 5.5, .97, { close: !attached, corner: 1.5 })];
  for (let y = 46, j = 0; y < Lp - 26; y += 46, j++) {
    const w = hw(y), x = cx(y);
    strokes.push(ln('seg' + j, [[x - w + 3, (y - 4) * sy], [x - w * .2, (y + 5) * sy], [x + w * .45, (y + 2) * sy]], 3.2, .8));
    strokes.push(ln('shine' + j, [[x + w * .45, (y + 14) * sy], [x + w * .55, (y + 32) * sy]], 3.4, .7, { color: '#d9a982' }));
  }
  if (!attached) strokes.push(ln('tip', [[cx(0) - 8, 6], [cx(0) - 2, -14], [cx(0) + 10, -10]], 3.6, .9));
  drawing(id, { line: C.poopLine, fills: [{ pts: contour, color: C.poop, corner: 1.5 }], strokes });
}
poop('poopE1', 46); poop('poopE2', 118); poop('poopE3', 196); poop('poopE4', 252);
poop('poopDrop', 258, { attached: false });
poop('poopFall', 258, { attached: false, sx: .86, sy: 1.14 });

// Скорость: вертикальные штрихи, три рисунка по очереди
['A', 'B', 'C'].forEach((k, j) => drawing('speed' + k, {
  strokes: Array.from({ length: 8 }, (_, i) => {
    const side = i % 2 ? 1 : -1, x = side * (70 + hash(i, j + 3) * 190), y = -200 + hash(i, j + 7) * 300, L = 140 + hash(i, j + 11) * 220;
    return ln('s' + i, [[x, y], [x + side * 4, y + L * .5], [x, y + L]], 2.6, .45);
  }),
}));

// Вода: поверхность (0,0) у левого края, заливка вниз. bulge — купол перед струёй.
function water(id, bulge = 0) {
  const top = [];
  for (let x = -80; x <= 2000; x += 40) top.push([x, -bulge * Math.exp(-(((x - 960) / 150) ** 2)) + 3 * Math.sin(x / 70)]);
  const ticks = [[300, 120], [620, 230], [1250, 160], [1580, 260], [880, 330], [180, 300], [1420, 420]].map(([x, y], i) =>
    ln('tick' + i, [[x - 40, y], [x - 12, y - 6], [x + 20, y - 4], [x + 44, y + 2]], 2.6, .5));
  const strokes = [ln('surface', top, 5.5, .95), ...ticks];
  if (bulge) strokes.push(ln('dome', [[960 - 90, -bulge * .45], [960 - 40, -bulge * .78], [960 + 10, -bulge * .9]], 3, .6, { color: C.foam }));
  drawing(id, { line: C.waterLine, fills: [{ pts: [...top, [2000, 1300], [-80, 1300]], color: C.water, al: .86, corner: .4 }], strokes });
}
water('water'); water('bulge1', 34); water('bulge2', 82);

// Корона брызг: k — фаза 0..1
function crown(id, w, h, spikes = 7, ph = 0) {
  const pts = [[-w - 50, 6]];
  for (let i = 0; i <= spikes * 2; i++) {
    const u = i / (spikes * 2), x = -w + u * 2 * w, tip = i % 2 === 1, env = Math.sin(Math.PI * (.15 + .7 * u));
    pts.push([x + (tip ? (x / w) * 26 : 0), tip ? -h * env * (.75 + .5 * hash(i, ph)) : -h * env * .3]);
  }
  pts.push([w + 50, 6]);
  const drops = [];
  for (let i = 1; i < spikes * 2; i += 4) { const p = pts[i + 1]; drops.push(ln('drop' + i, teardrop(p[0] + (p[0] / w) * 20, p[1] - 34, 8, (p[0] / w) * .6), 3, .9, { close: true, corner: 1.2 })); }
  drawing(id, {
    line: C.waterLine,
    fills: [{ pts, color: C.water, al: .9, corner: .9 }],
    strokes: [ln('crown', pts, 5, .95, { corner: .9 }), ...drops,
      ln('shine', [[-w * .5, -h * .2], [-w * .42, -h * .42]], 3.4, .8, { color: C.foam })],
  });
}
crown('crown1', 70, 70, 5, 1); crown('crown2', 120, 170, 7, 2); crown('crown3', 170, 230, 7, 3); crown('crown4', 220, 150, 8, 4); crown('crown5', 260, 60, 8, 5);

drawing('drop', { line: C.waterLine, fills: [{ pts: teardrop(0, 0, 10), color: C.water, corner: 1.2 }], strokes: [ln('d', teardrop(0, 0, 10), 3, .9, { close: true, corner: 1.2 })] });
drawing('dropR', { line: C.waterLine, fills: [{ pts: ring(0, 0, 9, 11, 8), color: C.water }], strokes: [ln('d', ring(0, 0, 9, 11, 8), 3, .9, { close: true })] });
[150, 250, 360, 470].forEach((r, i) => drawing('ripple' + i, {
  line: C.waterLine,
  strokes: [ln('front', [[-r, 0], [-r * .7, r * .1], [0, r * .14], [r * .7, r * .1], [r, 0]], 3.6 - i * .5, .8 - i * .12),
    ln('back', [[-r * .9, -4], [-r * .4, -r * .08], [r * .4, -r * .08], [r * .9, -4]], 2.4, .45 - i * .08)],
}));
drawing('bubble', { line: C.waterLine, fills: [{ pts: ring(0, 0, 16), color: '#bfe6f6' }], strokes: [ln('b', ring(0, 0, 16), 3.4, .9, { close: true }), ln('glint', [[-8, -6], [-3, -11]], 2.6, .9, { color: C.foam })] });
drawing('pop', { line: C.waterLine, strokes: [0, 1, 2, 3, 4, 5].map(k => { const a = k / 6 * TAU - Math.PI / 2; return ln('p' + k, [[Math.cos(a) * 16, Math.sin(a) * 16], [Math.cos(a) * 30, Math.sin(a) * 30]], 3, .8); }) });

// Струя: вогнутые бока, широкое основание, рваная верхушка
function jet(id, h) {
  const side = [[-360, 6], [-210, -16], [-120, -60], [-72, -150], [-54, -260], [-46, -Math.max(280, h * .55)], [-40, -h]];
  const top = [[-28, -h - 40], [-10, -h - 8], [8, -h - 56], [24, -h - 6], [42, -h - 30]];
  const pts = [...side, ...top, ...mirror(side).reverse()];
  const strokes = [ln('jet', pts, 5.5, .95, { corner: 1 })];
  for (let i = 0; i < 4; i++) strokes.push(ln('flow' + i, strand(-24 + i * 16, -h + 40, -30 + i * 20, -120, 4, 2.5, i), 2.6, .5));
  strokes.push(ln('shine', [[-30, -h * .7], [-34, -h * .4]], 4, .8, { color: C.foam }));
  for (let i = 0; i < 3; i++) strokes.push(ln('spray' + i, teardrop(-70 + i * 70, -h - 70 - i * 20, 7, (i - 1) * .5), 3, .85, { close: true, corner: 1.2 }));
  drawing(id, { line: C.waterLine, fills: [{ pts, color: C.water, al: .92, corner: 1 }], strokes });
}
jet('jet1', 240); jet('jet2', 560); jet('jet3', 980); jet('jet4', 1500);

// Водяной Посейдон в профиль, лицом влево (на экране повёрнут вверх-влево).
// lips: pucker | smile; eye: shut | smug; stream: волосы/борода стекают вниз при подъёме.
function poseidonSide(id, { lips = 'pucker', eye = 'shut', brow = 'up', stream = 0, tilt = 0 }) {
  const st = stream * 70;
  const beard = [[-20, 1500], [-40, 600], [-62, 500], [-84, 455 + st * .4], [-70, 430], [-108, 400 + st * .3], [-128, 340], [-150, 280], [-140, 215], [-150, 160], [-132, 118]];
  const mouth = lips === 'pucker'
    ? [[-138, 108], [-178, 106], [-214, 96], [-236, 80], [-222, 67], [-238, 54], [-220, 38], [-178, 40], [-152, 46]]
    : [[-134, 106], [-140, 96], [-136, 86], [-128, 79], [-138, 70], [-142, 58], [-134, 50]];
  const face = [[-128, 46], [-146, 42], [-166, 32], [-154, 12], [-126, -20], [-112, -44], [-122, -62], [-116, -96], [-96, -150], [-46, -192], [28, -204]];
  const hair = [[100, -208], [180, -186], [250, -140], [320, -80], [384, -20 + st], [430, 40 + st * 1.4], [372, 26 + st], [404, 96 + st * 1.2], [338, 92 + st * .5], [300, 140], [360, 220], [440, 330], [500, 480], [520, 1500]];
  const outline = [...beard, ...mouth, ...face, ...hair];
  const by = brow === 'up' ? -12 : 0;
  const strokes = [
    ln('outline', outline, 6.5, .97, { corner: 1.25 }),
    ln('brow', [[-122, -72 + by], [-100, -84 + by * 1.3], [-72, -80 + by], [-50, -70 + by * .6]], 7, .95),
    ln('nostril', [[-150, 30], [-140, 26], [-134, 32]], 3, .8),
    ln('stache', [[-138, 50], [-112, 56], [-88, 70], [-76, 96], [-82, 126]], 4.6, .9),
    ln('stache2', [[-122, 56], [-98, 76], [-94, 106]], 3, .7),
    ln('beard1', strand(-112, 128, -100, 380 + st * .3, 9, 1.5, 0), 3.4, .7),
    ln('beard2', strand(-82, 140, -64, 430 + st * .4, 10, 1.3, 1), 3.4, .7),
    ln('beard3', strand(-50, 150, -26, 400, 9, 1.6, 2), 3, .6),
    ln('hair1', strand(-30, -176, 300, -66 + st * .6, 9, 1.2, 0), 3.4, .7),
    ln('hair2', strand(20, -140, 350, 4 + st, 11, 1.4, 1), 3.4, .7),
    ln('hair3', strand(50, -92, 310, 84 + st, 9, 1.3, 2), 3.2, .6),
    ln('hair4', strand(70, -30, 270, 140, 7, 1, .7), 3, .55),
    ln('body1', [[200, 300], [260, 322], [300, 362]], 3, .5),
    ln('body2', [[120, 430], [190, 448], [240, 490]], 3, .45),
    ln('hi1', [[-74, -172], [-100, -132]], 5, .85, { color: C.foam }),
    ln('hi2', [[210, -168], [262, -128]], 5, .8, { color: C.foam }),
    ln('hi3', [[-146, 210], [-142, 252]], 4, .75, { color: C.foam }),
  ];
  if (eye === 'shut') strokes.push(ln('eye', [[-112, -48], [-94, -36], [-74, -44]], 6.5, .97), ln('lash', [[-96, -37], [-100, -26]], 3.4, .8), ln('lash2', [[-84, -39], [-84, -28]], 3, .7));
  else strokes.push(ln('lid', [[-114, -50], [-96, -58], [-74, -50]], 5.5, .95), ln('pupil', ring(-102, -45, 5, 5, 6), 4, .95, { close: true }), ln('under', [[-108, -36], [-92, -32], [-78, -36]], 2.6, .55));
  if (lips === 'pucker') strokes.push(ln('cheek', [[-108, 12], [-96, 36], [-104, 60]], 3.2, .6), ln('seam', [[-222, 67], [-190, 70], [-164, 78]], 3.4, .85), ln('lipLine', [[-206, 92], [-186, 86]], 2.6, .5));
  else strokes.push(ln('smile', [[-136, 78], [-120, 72], [-104, 54], [-100, 34]], 3.6, .8), ln('cheek', [[-104, -2], [-86, 8]], 3, .6));
  // запрокинуть голову на шее: выше подбородка — целиком, к плечам — на нет
  const neck = pts => pts.map(([x, y]) => {
    const a = tilt * clamp((330 - y) / 220, 0, 1), c = Math.cos(a), s = Math.sin(a), dx = x - 150, dy = y - 250;
    return [150 + dx * c - dy * s, 250 + dx * s + dy * c];
  });
  strokes.forEach(s => { s.points = neck(s.points); });
  drawing(id, { line: C.waterLine, fills: [{ pts: neck([...outline, [520, 1540], [-20, 1540]]), color: C.water, corner: 1.25 }], strokes });
  D[id].lips = neck([[-236, 64]])[0];
}
poseidonSide('psRise', { lips: 'pucker', eye: 'shut', stream: 1, tilt: .15 });
poseidonSide('psReach', { lips: 'pucker', eye: 'shut', stream: .4, tilt: .25 });
poseidonSide('psKiss', { lips: 'pucker', eye: 'shut', stream: 0, tilt: .32 });

// ── План 1: выход, падение, плюх, струя ──────────────────────────────────────
const BUTT1 = [960, 150], Y_W = 1500, G = 2600, V0 = 150;
const POOP_EMERGE = seq([['poopE1', 6], ['poopE2', 5], ['poopE3', 5], ['poopE4', 5]]);
const T1 = { det: POOP_EMERGE.duration, dur: 3.3 };
const fallY = t => t <= 0 ? BUTT1[1] : BUTT1[1] + V0 * t + .5 * G * t * t; // верх какашки
T1.hit = T1.det + (-V0 + Math.sqrt(V0 * V0 + 2 * G * (Y_W - 258 - BUTT1[1]))) / G;
T1.vHit = V0 + G * (T1.hit - T1.det);
T1.bubble = T1.hit + .5; T1.bulge = T1.hit + .85; T1.jet = T1.hit + 1.12;
const SPLASH = seq([['crown1', 2], ['crown2', 3], ['crown3', 3], ['crown4', 4], ['crown5', 3]]);
const JET = seq([['jet1', 2], ['jet2', 2], ['jet3', 2], ['jet4', 24]]);
function camera1(tau) { // плавный старт и мягкая остановка над водой
  if (tau < T1.det) return 0;
  const raw = fallY(tau - T1.det - .06) - 330, a = 120;
  let y = raw > a ? raw : raw < -a ? 0 : (raw + a) ** 2 / (4 * a);
  return y < 640 ? y : 720 - 80 * Math.exp(-(y - 640) / 80);
}
function shot1(c, tau) {
  paper(c, C.paper, null, 87);
  const camY = camera1(tau), t2 = twos(tau);
  c.save(); c.translate(0, -camY);
  // какашка (за попой, пока висит)
  let pid, py;
  if (tau < T1.det) { pid = POOP_EMERGE.at(tau).id; py = BUTT1[1]; }
  else if (tau < T1.hit) { pid = tau - T1.det < .14 ? 'poopDrop' : 'poopFall'; py = fallY(tau - T1.det); }
  else { const u = tau - T1.hit; pid = 'poopDrop'; py = Y_W - 258 + T1.vHit * (1 - Math.exp(-7 * u)) / 7; }
  const sinkA = tau < T1.hit ? 1 : clamp(1 - (tau - T1.hit) / 1.2, 0, 1);
  if (sinkA > 0) drawSpr(c, pid, BUTT1[0], py, { alpha: sinkA });
  if (camY < 900) drawSpr(c, 'butt', ...BUTT1);
  // линии скорости — пока камера едет за падением
  if (tau > T1.det + .2 && tau < T1.hit) drawSpr(c, 'speed' + 'ABC'[Math.floor(tau * 12) % 3], BUTT1[0], fallY(tau - T1.det) + 120, { alpha: .9 });
  // вода: гладь → купол → струя
  const wid = tau < T1.bulge ? 'water' : tau < T1.bulge + .14 ? 'bulge1' : tau < T1.jet ? 'bulge2' : 'water';
  if (Y_W - camY < H + 40) drawSpr(c, wid, 0, Y_W);
  // круги
  const rt = tau - T1.hit - .18;
  if (rt >= 0 && rt < .9) drawSpr(c, 'ripple' + Math.min(3, Math.floor(rt / .2)), 960, Y_W + 8, { alpha: 1 - rt / .9 });
  // корона брызг
  const sp = tau - T1.hit;
  if (sp >= 0 && sp < SPLASH.duration) drawSpr(c, SPLASH.at(sp).id, 960, Y_W, { scale: 1.6 });
  // капли: баллистика на двоечках
  const dt = t2 - T1.hit;
  if (dt > 0 && dt < 1) for (let k = 0; k < 9; k++) {
    const vx = (hash(k, 21) - .5) * 900, vy = 700 + hash(k, 22) * 700, y = Y_W - 60 - vy * dt + .5 * 2600 * dt * dt;
    if (y > Y_W || dt < .06) continue;
    drawSpr(c, dt < .25 ? 'drop' : 'dropR', 960 + vx * dt, y, { rot: Math.atan2(vx, vy - 2600 * dt) * (dt < .25 ? -1 : 0) });
  }
  // бульки
  for (const [t0, x] of [[T1.bubble, 930], [T1.bubble + .2, 1000]]) {
    const u = tau - t0;
    if (u >= 0 && u < .18) drawSpr(c, 'bubble', x, Y_W - 6 - u * 60);
    else if (u >= .18 && u < .3) drawSpr(c, 'pop', x, Y_W - 18);
  }
  // струя
  const jt = tau - T1.jet;
  if (jt >= 0) drawSpr(c, JET.at(jt).id, 960, Y_W + 4);
  c.restore();
  grainOver(c, 11);
}

// ── План 2: Посейдон целует и тычет ──────────────────────────────────────────
const T2 = { dur: 3.0, reach: .3, kiss: .42, back: 1.05, smug: 1.2, hand: 1.25, handUp: 1.6, poke: 1.95, touch: 2.1, unpoke: 2.8 };
const BUTT2 = [960, 40], KISS = [1252, 160], PS = { s: 1.18, rot: .78, smug: [1530, 400] };
// корень позы поцелуя: кончик губ ровно в точке касания
PS.kiss = (() => { const [x, y] = D.psKiss.lips, c = Math.cos(PS.rot), s = Math.sin(PS.rot); return [KISS[0] - PS.s * (x * c - y * s), KISS[1] - PS.s * (x * s + y * c)]; })();
function shot2(c, tau) {

  const t2 = twos(tau);
  // попа подпрыгивает от касаний
  const jig = (t, t0) => t >= t0 && t < t0 + .4 ? -10 * Math.exp(-(t - t0) * 9) * Math.cos((t - t0) * 40) : 0;
  const pokeK = t2 >= T2.touch && t2 < T2.unpoke ? Math.floor((t2 - T2.touch) / .16) : -1;
  const by = BUTT2[1] + jig(t2, T2.kiss) + jig(t2, T2.touch) + (pokeK >= 0 ? (pokeK % 2 ? -4 : 0) : 0);
  // Посейдон: подъём → касание → откат с ухмылкой
  let pid, oy = 0, k = 0; // k: 0 — поза поцелуя, 1 — откинулся с ухмылкой
  if (tau < T2.reach) { pid = 'psRise'; oy = 700 * (1 - easeOut(t2 / T2.reach)) + 40; }
  else if (tau < T2.kiss) { pid = 'psReach'; oy = 40 * (1 - (t2 - T2.reach) / (T2.kiss - T2.reach)); }
  else if (tau < T2.back) pid = 'psKiss';
  else { pid = tau < T2.smug ? 'psKiss' : 'psSmug'; k = easeOut(clamp((t2 - T2.back) / .25, 0, 1)); oy = 6 * Math.sin((t2 - T2.back) * 5) * k; }
  const [px, py] = PS.kiss.map((v, i) => lerp(v, PS.smug[i], k));
  drawSpr(c, pid, px, py + oy, { scale: PS.s, rot: PS.rot });
  // яички выходят из-под ягодиц: рисуются до попы, верх прячется за щеками
  const side = pokeK < 0 ? '' : pokeK % 2 ? 'R' : 'L'; // по очереди: левое, правое, левое…
  drawSpr(c, 'balls' + side, BUTT2[0], by + 4, { scale: 1.15 });
  // мокрые следы: на каждом яичке после первого касания его пальцем, едут вместе с поджатием
  for (const [s, x, t0] of [['L', -40, T2.touch], ['R', 44, T2.touch + .16]])
    if (t2 >= t0) drawSpr(c, 'wet', BUTT2[0] + x * 1.15, by + 4 + 1.15 * 166 * (side === s ? .95 : 1), { scale: .6, alpha: .85 });
  drawSpr(c, 'butt', BUTT2[0], by);
  // мокрое пятно от поцелуя, «чмок», сердечко
  const KX = KISS[0], KY = by - BUTT2[1] + KISS[1] + 10;
  if (tau >= T2.kiss) drawSpr(c, 'wet', KX, KY - 4, { alpha: .85 });
  if (tau >= T2.kiss && tau < T2.kiss + .3) drawSpr(c, 'smooch', KX, KY + 10);
  const ht = t2 - T2.kiss - .15;
  if (ht >= 0 && ht < .9) drawSpr(c, 'heart', KX - 120 - ht * 60, KY + 120 - ht * 40, { alpha: 1 - Math.max(0, ht - .6) / .3, scale: .9 + ht * .3 });
  // рука: «виктория» снизу; щекочет по очереди — один палец тянется к своему яичку, другой поджат
  const HX = BUTT2[0], handY = { low: 1400, v: 700, touch: 558 + by - BUTT2[1] };
  if (tau >= T2.hand) {
    let hy;
    if (t2 < T2.handUp) hy = lerp(handY.low, handY.v, easeOut((t2 - T2.hand) / (T2.handUp - T2.hand)));
    else if (t2 < T2.poke) hy = handY.v + 6 * Math.sin((t2 - T2.handUp) * 16);
    else if (t2 < T2.touch) hy = lerp(handY.v, handY.touch, easeIn((t2 - T2.poke) / (T2.touch - T2.poke)));
    else if (t2 < T2.unpoke) hy = handY.touch;
    else hy = lerp(handY.touch + 20, handY.low, easeIn(clamp((t2 - T2.unpoke) / .35, 0, 1)));
    drawSpr(c, 'handV' + (t2 < T2.unpoke ? side : ''), HX, hy, { scale: 1.1 });
  }
  if (side) drawSpr(c, 'boop', HX + (side === 'R' ? 90 : -90), by + 235, { scale: .8, rot: side === 'R' ? .6 : -.6 });
  grainOver(c, 12);
}

// ── План 3: лицо — блаженство → шок ─────────────────────────────────────────
const T3 = { dur: 1.9, shock: .62 };
function shot3(c, tau) {
  paper(c, C.pink, null, 89);
  const t2 = twos(tau), shocked = tau >= T3.shock, u = t2 - T3.shock;
  const dx = shocked && u < .4 ? (Math.floor(u * 12) % 2 ? 7 : -7) : 0;
  const dy = shocked ? -18 * Math.exp(-u * 8) : 4 * Math.sin(t2 * 4);
  drawSpr(c, shocked ? 'shock' : 'calm', CX + dx, CY + 70 + dy, { scale: 1.3 });
  if (shocked && u < .35) drawSpr(c, 'shockLines', CX, CY + 70, { scale: 1.3, alpha: 1 - u / .35 });
  if (shocked && u > .12) drawSpr(c, u > .3 ? 'sweat2' : 'sweat1', CX + dx, CY + 70, { scale: 1.3 });
  grainOver(c, 13);
}

// ── План 4: Посейдон в короне подмигивает и уходит в глубину ─────────────────
const T4 = { dur: 3.0, wink: 1.0, unwink: 1.45, sink: 1.6, sunk: 2.6 };
function shot4(c, tau) {
  paper(c, C.deep, null, 90);
  const t2 = twos(tau);
  // световые полосы глубины
  c.save(); c.globalAlpha = .07; c.fillStyle = '#bff0ff';
  for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(300 + k * 420, -10); c.lineTo(420 + k * 420, -10); c.lineTo(160 + k * 420, H + 10); c.lineTo(80 + k * 420, H + 10); c.fill(); }
  c.restore();
  const id = tau >= T4.wink && tau < T4.unwink ? 'kingWink' : Math.floor(tau / (4 / 24)) % 2 ? 'kingB' : 'kingA';
  const u = clamp((t2 - T4.sink) / (T4.sunk - T4.sink), 0, 1), k = easeIn(u);
  if (u < 1) drawSpr(c, id, CX, 560 + k * 760 + (tau < T4.sink ? 4 * Math.sin(t2 * 3) : 0), { scale: .95 * (1 - .45 * k) });
  if (tau >= T4.wink && tau < T4.wink + .35) drawSpr(c, 'sparkle', CX - 150, 400, { scale: .7 + (t2 - T4.wink) * 1.2 });
  // пузыри при погружении
  for (let b = 0; b < 8; b++) {
    const bt = t2 - T4.sink - b * .1;
    if (bt < 0 || bt > 1.6) continue;
    drawSpr(c, 'kBubble', CX + (hash(b, 31) - .5) * 520 + Math.sin(bt * 6 + b) * 14, 900 - bt * 520 - hash(b, 32) * 120, { scale: .6 + hash(b, 33) * .8, alpha: 1 - bt / 1.6 });
  }
  grainOver(c, 14, .07);
}

const TL = { s1: 0, s2: T1.dur, s3: T1.dur + T2.dur, s4: T1.dur + T2.dur + T3.dur };
const DUR = TL.s4 + T4.dur;
defineFilm({
  palette: { ...PALETTES.pencilMinimal, paper: C.paper },
  format: { ar: '16:9', width: 1920 }, fps: 24,
  timeline: [
    { name: 'plop', dur: T1.dur, fn: shot1 },
    { name: 'kiss', dur: T2.dur, fn: shot2 },
    { name: 'face', dur: T3.dur, fn: shot3 },
    { name: 'king', dur: T4.dur, fn: shot4 },
  ],
  score,
});

// Автоплей: стартуем сразу и без звука (браузеры требуют жест для аудио —
// кнопка «sound: off» в панели включает его настоящим кликом). Плеер лупит сам.
if (!location.search.includes('bare'))
  setTimeout(() => { const b = document.getElementById('play'); if (b && b.textContent === 'play') b.click(); }, 80);

// Живой звук, синхронный с циклом. Штатный плеер играет score лишь один раз
// и только если звук был включён ДО нажатия play. Вместо спрятанной в панели
// кнопки: (1) пробуем включить звук сразу — если браузер разрешает, посетитель
// не видит ничего лишнего; (2) иначе показываем fixed-плашку «включить звук»
// поверх кадра и включаем звук первым же кликом/тапом в любом месте страницы.
// Ручное выключение в панели уважается (авто больше не возвращает звук).
// Score перепланируется по аудио-часам на каждом витке; включение звука
// перезапускает цикл с нуля, чтобы звук и картинка шли вместе.
(() => {
  if (location.search.includes('bare')) return;
  const playBtn = document.getElementById('play'), sndBtn = document.getElementById('snd'), scrub = document.getElementById('scrub');
  if (!playBtn || !sndBtn || !scrub) return;
  const hint = document.createElement('button');
  hint.textContent = 'включить звук';
  hint.style.cssText = 'position:fixed;top:14px;right:14px;z-index:9;background:#f5f0e5;color:#423930;border:2px solid #423930;border-radius:10px;padding:8px 16px;font:600 15px system-ui,sans-serif;cursor:pointer;box-shadow:2px 3px 0 rgba(66,57,48,.35)';
  document.body.appendChild(hint);
  let ac = null, feed = null, timer = null, nextT0 = 0, on = false, userMuted = false;
  const playing = () => playBtn.textContent === 'pause';
  const kill = () => { if (feed) { try { feed.disconnect(); } catch (e) {} } feed = null; if (timer) { clearInterval(timer); timer = null; } };
  const schedule = t => { score(ac, t, feed); nextT0 = t + DUR; };
  const start = () => {
    kill(); if (!on || !ac) return;
    feed = ac.createGain(); feed.connect(ac.destination);
    schedule(ac.currentTime + .08);
    timer = setInterval(() => { if (nextT0 < ac.currentTime + DUR) schedule(nextT0); }, 250);
  };
  const setOn = v => { on = v; sndBtn.textContent = 'sound: ' + (on ? 'on' : 'off'); hint.style.display = on ? 'none' : ''; };
  const enable = () => {
    if (on) return;
    userMuted = false; setOn(true);
    ac = ac || new AudioContext();
    ac.resume().then(() => { if (playing()) { playBtn.click(); playBtn.click(); } else start(); }); // рестарт цикла вместе со звуком
  };
  sndBtn.onclick = () => { if (on) { userMuted = true; setOn(false); kill(); } else enable(); };
  hint.onclick = () => enable();
  playBtn.addEventListener('click', () => { if (playing()) { if (on && ac) start(); } else kill(); });
  scrub.addEventListener('input', kill);
  // любой первый клик/тап/клавиша вне панели плеера включает звук
  const wake = e => { if (!on && !userMuted && !(e.target.closest && e.target.closest('.bar'))) enable(); };
  addEventListener('pointerdown', wake);
  addEventListener('keydown', wake);
  // попытка честного автозвука: повторным посетителям/разрешающим браузерам можно
  setTimeout(async () => {
    try {
      ac = ac || new AudioContext();
      await Promise.race([ac.resume(), new Promise(r => setTimeout(r, 400))]);
      if (ac.state === 'running' && !on && !userMuted) enable();
    } catch (e) {}
  }, 350);
})();

// ── Саундтрек ─────────────────────────────────────────────────────────────────
function score(ac, t0, dest) {
  const master = ac.createGain(); master.gain.setValueAtTime(.72, t0); master.gain.setValueAtTime(.72, t0 + DUR - .5); master.gain.linearRampToValueAtTime(0, t0 + DUR);
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 20; comp.ratio.value = 2.6; comp.attack.value = .015; comp.release.value = .25;
  master.connect(comp); comp.connect(dest);
  const hz = n => 440 * 2 ** ((n - 69) / 12);
  const send = (node, pan = 0) => { const p = ac.createStereoPanner(); p.pan.value = pan; node.connect(p); p.connect(master); };
  function glide(t, f0, f1, d, vol, type = 'sine', pan = 0) {
    const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t0 + t); o.frequency.exponentialRampToValueAtTime(f1, t0 + t + d);
    const e = ac.createGain(); e.gain.setValueAtTime(0, t0 + t); e.gain.linearRampToValueAtTime(vol, t0 + t + .015); e.gain.exponentialRampToValueAtTime(.0008, t0 + t + d);
    o.connect(e); send(e, pan); o.start(t0 + t); o.stop(t0 + t + d + .05);
  }
  function noise(t, d, vol, type, f0, f1, q = 1, seed = 1) {
    const src = ac.createBufferSource(), buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * d), ac.sampleRate), ch = buf.getChannelData(0), r = rng(seed);
    for (let i = 0; i < ch.length; i++) ch[i] = (r() * 2 - 1) * Math.sin(Math.PI * i / ch.length);
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t0 + t); f.frequency.exponentialRampToValueAtTime(f1, t0 + t + d);
    const g = ac.createGain(); g.gain.value = vol; src.buffer = buf; src.connect(f); f.connect(g); send(g); src.start(t0 + t);
  }
  function brass(t, notes, d, vol) { // мягкие медные: пила через фильтр с медленной атакой
    for (const n of notes) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(n);
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(400, t0 + t); f.frequency.linearRampToValueAtTime(1500, t0 + t + .25);
      const e = ac.createGain(); e.gain.setValueAtTime(0, t0 + t); e.gain.linearRampToValueAtTime(vol, t0 + t + .12); e.gain.setValueAtTime(vol, t0 + t + d * .7); e.gain.exponentialRampToValueAtTime(.0008, t0 + t + d);
      o.connect(f); f.connect(e); send(e, (n % 7 - 3) * .08); o.start(t0 + t); o.stop(t0 + t + d + .05);
    }
  }
  const harp = (t, notes, step = .045, vol = .1) => notes.forEach((n, k) => note(ac, master, hz(n), t0, t + k * step, .9, 'triangle', vol));
  // I: натуга, отрыв, падение, плюх
  { const o = ac.createOscillator(), e = ac.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(48, t0); o.frequency.linearRampToValueAtTime(72, t0 + T1.det);
    e.gain.setValueAtTime(0, t0); e.gain.linearRampToValueAtTime(.12, t0 + T1.det - .05); e.gain.linearRampToValueAtTime(0, t0 + T1.det + .05);
    o.connect(e); send(e); o.start(t0); o.stop(t0 + T1.det + .1); }
  [.2, .4, .6].forEach((t, k) => glide(t, 160 - k * 15, 90, .12, .14, 'sawtooth'));      // выдавливание
  glide(T1.det - .02, 520, 140, .09, .22); noise(T1.det - .02, .08, .25, 'lowpass', 900, 300, 1, 3); // шлёп-отрыв
  glide(T1.det + .1, hz(88), hz(52), T1.hit - T1.det - .1, .08);                         // свист падения
  glide(T1.hit, 700, 140, .16, .38); noise(T1.hit, .5, .45, 'lowpass', 2400, 300, .8, 5);  // ПЛЮХ
  { const o = ac.createOscillator(), e = ac.createGain(); o.frequency.setValueAtTime(90, t0 + T1.hit); o.frequency.exponentialRampToValueAtTime(40, t0 + T1.hit + .25);
    e.gain.setValueAtTime(.4, t0 + T1.hit); e.gain.exponentialRampToValueAtTime(.0008, t0 + T1.hit + .4); o.connect(e); send(e); o.start(t0 + T1.hit); o.stop(t0 + T1.hit + .45); }
  for (let k = 0; k < 6; k++) glide(T1.hit + .25 + k * .07, 1400 + hash(k, 41) * 900, 2600 + hash(k, 42) * 600, .05, .05, 'sine', (hash(k, 43) - .5)); // капли
  glide(T1.bubble + .15, 280, 900, .08, .16); glide(T1.bubble + .35, 320, 1000, .08, .14);  // бульк-бульк
  noise(T1.bulge, T1.jet - T1.bulge + .1, .2, 'lowpass', 150, 900, 2, 7);                  // рокот
  noise(T1.jet, .9, .35, 'bandpass', 400, 3500, 1.2, 8);                                     // струя
  harp(T1.jet + .15, [60, 64, 67, 71, 72, 76, 79, 83, 84], .04, .09);                        // волшебство
  // II: поцелуй, ухмылка, виктория, тык
  const s2 = TL.s2;
  harp(s2 + .05, [72, 76, 79, 84], .06, .07);
  noise(s2 + T2.kiss, .03, .5, 'highpass', 2000, 3000, .7, 9);                              // чмок
  glide(s2 + T2.kiss + .02, 500, 1300, .14, .2);
  note(ac, master, hz(84), t0, s2 + T2.kiss + .2, .4, 'sine', .07); note(ac, master, hz(88), t0, s2 + T2.kiss + .32, .5, 'sine', .06);
  [[s2 + T2.smug + .05, 67], [s2 + T2.smug + .2, 64]].forEach(([t, n]) => note(ac, master, hz(n), t0, t, .3, 'triangle', .1)); // хм-хм
  harp(s2 + T2.handUp - .1, [79, 83, 86], .05, .07);
  glide(s2 + T2.touch, 300, 760, .1, .3); noise(s2 + T2.touch, .04, .2, 'lowpass', 900, 400, 1, 10); // БУП
  for (let k = 1; k * .16 < T2.unpoke - T2.touch; k++) glide(s2 + T2.touch + k * .16, k % 2 ? 420 : 340, k % 2 ? 300 : 520, .08, .12, 'sine', k % 2 ? .3 : -.3); // щекотка по очереди
  // III: блаженство → шок
  const s3 = TL.s3;
  [60, 64, 67].forEach(n => note(ac, master, hz(n), t0, s3 + .02, .6, 'sine', .06));
  brass(s3 + T3.shock, [49, 55, 61, 62], .7, .07); noise(s3 + T3.shock, .3, .3, 'bandpass', 800, 3000, .6, 11);
  glide(s3 + T3.shock + .05, hz(70), hz(94), .5, .07);
  // IV: величие, подмигивание, погружение, титр
  const s4 = TL.s4;
  brass(s4 + .02, [48, 55, 60, 64], 1.0, .06); brass(s4 + .5, [53, 57, 60, 65], .9, .055);
  note(ac, master, hz(96), t0, s4 + T4.wink + .02, .35, 'sine', .08); note(ac, master, hz(100), t0, s4 + T4.wink + .1, .4, 'sine', .06);
  for (let k = 0; k < 8; k++) glide(s4 + T4.sink + k * .11, 220 + hash(k, 51) * 200, 700 + hash(k, 52) * 400, .07, .09, 'sine', (hash(k, 53) - .5) * .6);
  brass(s4 + T4.sink, [55, 59, 62], .8, .045);
  brass(s4 + T4.sunk - .2, [48, 52, 55, 60], .6, .05);
}
</script>

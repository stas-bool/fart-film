<!doctype html>

<title>Пук · pencil comedy study</title>
<style>body{margin:0;background:#242321;display:grid;place-items:center;min-height:100vh}canvas{max-width:100vw;max-height:100vh;object-fit:contain}</style>
<canvas id="c"></canvas>
<script src="core.js"></script>

<script>
'use strict';
// ─────────────────────────────────────────────────────────────────────────────
// БРИФ
// Сюжет: комедийный гэг в три ступени. Попа-персонаж (глаза на щеках, складка,
// ножки в туфельках) осматривается, напрягается, пукает — и взлетает как
// бутылочная ракета; зависает, падает, шлёпается. Гордится собой. На бис
// решает пуKNуть ещё разок миленько — но перестаралась: обкакалась.
// Шок, оглядка «кто-нибудь видел?», смущение — и птица уносит какашку
// за кадр: embarrassment разрешается, попа возвращается в покой → луп.
// Длительность ~9.0 с; 16:9; 1920x1080. Look: pencil (sketchbook).
// Техника: целые позы-селы + assisted inbetweens (только совместимые топологии
// глаз); замены глаз (блинк, жмурки, счастье) — replacement cels; тряска
// напряжения — чередование двух авторских селов; облака/пыль/какашка —
// конечный набор селов, детерминированно от tau. Камера: locked.
// Звук: Web Audio — гул, синтезированный пук (пила с вибрато + шум), свист,
// шлепок, plop, грустный ва-ва-тромбон.
// Сложнейший экшен: взлёт/падение — размещение корня входит в each drawing.
// ─────────────────────────────────────────────────────────────────────────────
const LOOK = new URLSearchParams(location.search).get('look') || 'pencil';
if (!['pencil','ink'].includes(LOOK)) throw new Error('Use --look pencil or ink');
const INK = LOOK === 'pencil' ? '#423930' : '#302c29';
const POOP_INK = '#6b4a34', STINK_INK = '#7d6c4a';
const pressure = [[0,.1],[.14,.75],[.4,1],[.72,.62],[1,.06]];

// ── Персонаж: генератор целых поз ────────────────────────────────────────────
// q>0 — присед/сплющивание, q<0 — вытяжка. clench — сжатие щёк (глубже складка).
// eyes: open|wide|squint|shut|happy + pupil смещение. brows: relax|up|knit.
// legs: stand (стопы на земле — контакт) | dangle | tuck | splay.
function pose(o) {
  const q = o.q || 0, clench = o.clench || 0;
  const hy = 1 - .42 * q, wx = 1 + .30 * q;
  const R = 74, cx = 62;
  const P = ([x, y]) => [x * wx, y * hy];
  const contour = [];
  for (let k = 0; k <= 7; k++) { // правая доля сверху вниз
    const a = (-100 + 200 * k / 7) * Math.PI / 180;
    contour.push(P([cx + R * Math.cos(a), R * Math.sin(a) * .96]));
  }
  contour.push([0, 44 * hy + clench * 8]); // глубокая нижняя выемка между щеками
  for (let k = 7; k >= 0; k--) { // левая доля
    const a = (-100 + 200 * k / 7) * Math.PI / 180;
    contour.push(P([-cx + R * -Math.cos(a), R * Math.sin(a) * .96]));
  }
  contour.push([0, -84 * hy]); // гладкий купол сверху — спина, не «две груди»
  const crease = [
    [2, -16 * hy], [-4, 4 * hy], [3, 26 * hy], [-2, 44 * hy - clench * 6],
  ].map(([x, y], i) => [x + (i % 2 ? 2 : -2) * clench, y]);
  const eL = P([-40, -46]), eR = P([40, -46]), er = 15;
  const ring = (c, r) => { const p = []; for (let k = 0; k < 8; k++) { const a = -Math.PI / 2 + k * Math.PI / 4; p.push([c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)]); } p.push(p[0].slice()); return p; };
  const pup = (c, [dx, dy]) => { const p = [], r = 4.6; for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2; p.push([c[0] + dx + r * Math.cos(a), c[1] + dy + r * Math.sin(a)]); } p.push(p[0].slice()); return p; };
  const lidShut = (c) => [[c[0] - 15, c[1] - 2], [c[0] - 4, c[1] + 5], [c[0] + 7, c[1] + 4], [c[0] + 15, c[1] - 3]];
  const lidHappy = (c) => [[c[0] - 14, c[1] + 6], [c[0] - 4, c[1] - 5], [c[0] + 6, c[1] - 5], [c[0] + 14, c[1] + 6]];
  const lidSquint = (c) => [[c[0] - 15, c[1] - 9], [c[0] - 5, c[1] - 1], [c[0] + 6, c[1] - 1], [c[0] + 15, c[1] - 9]];
  const eyeStrokes = [];
  const t = o.eyes || 'open', pupilD = o.pupil || [0, 0];
  for (const c of [eL, eR]) {
    const side = c === eL ? 'L' : 'R';
    if (t === 'open') { eyeStrokes.push({ id: 'eye' + side, pts: ring(c, er) }, { id: 'pupil' + side, pts: pup(c, pupilD) }); }
    else if (t === 'wide') { eyeStrokes.push({ id: 'eye' + side, pts: ring(c, 19) }, { id: 'pupil' + side, pts: pup(c, [pupilD[0] * .5, pupilD[1] * .5]) }); }
    else if (t === 'squint') { eyeStrokes.push({ id: 'eye' + side, pts: ring(c, er) }, { id: 'lid' + side, pts: lidSquint(c) }); }
    else if (t === 'shut') { eyeStrokes.push({ id: 'lid' + side, pts: lidShut(c) }); }
    else if (t === 'happy') { eyeStrokes.push({ id: 'lid' + side, pts: lidHappy(c) }); }
  }
  const bt = o.brows || 'relax';
  const brow = (side) => {
    const c = side < 0 ? eL : eR, w = side < 0 ? -1 : 1, y0 = c[1] - (bt === 'up' ? 30 : 23);
    if (bt === 'knit') return [[c[0] - w * 16, y0 + 11], [c[0], y0 + 4], [c[0] + w * 14, y0 + 2]];
    if (bt === 'up') return [[c[0] - w * 15, y0 + 2], [c[0] + w * 1, y0 - 5], [c[0] + w * 14, y0 - 2]];
    return [[c[0] - w * 14, y0], [c[0], y0 - 3], [c[0] + w * 13, y0 - 1]];
  };
  const legMode = o.legs || 'stand';
  const hipL = P([-54, 56]), hipR = P([54, 56]);
  let legL, legR, footL, footR;
  if (legMode === 'stand') {
    const spread = 26 * q;
    legL = [hipL, [-54 - spread, 96], [-50, 124]];
    legR = [hipR, [54 + spread, 96], [50, 124]];
    footL = [[-78, 126], [-52, 122], [-34, 128], [-44, 137], [-70, 136]];
    footR = [[34, 128], [52, 122], [78, 126], [70, 136], [44, 137]];
  } else if (legMode === 'dangle') {
    legL = [hipL, [-62, 92], [-56, 116]];
    legR = [hipR, [62, 92], [56, 116]];
    footL = [[-74, 118], [-52, 122], [-38, 112], [-48, 105], [-68, 108]];
    footR = [[38, 112], [52, 122], [74, 118], [68, 108], [48, 105]];
  } else if (legMode === 'tuck') {
    legL = [hipL, [-70, 84], [-62, 96]];
    legR = [hipR, [70, 84], [62, 96]];
    footL = [[-80, 100], [-60, 100], [-48, 92], [-58, 86], [-76, 90]];
    footR = [[48, 92], [60, 100], [80, 100], [76, 90], [58, 86]];
  } else { // splay — шлепок
    legL = [hipL, [-84, 92], [-108, 108]];
    legR = [hipR, [84, 92], [108, 108]];
    footL = [[-130, 112], [-110, 104], [-96, 116], [-108, 124], [-128, 122]];
    footR = [[96, 116], [110, 104], [130, 112], [128, 122], [108, 124]];
  }
  const shade = [];
  for (let i = 0; i < 7; i++) {
    const u = i / 6, y = 52 * hy - 4 + Math.sin(u * Math.PI) * 8;
    shade.push([[-118 + u * 82, y], [-108 + u * 82, y + 6 + hash(i, 3) * 4], [-102 + u * 82, y + 10]]);
    shade.push([[118 - u * 82, y], [108 - u * 82, y + 6 + hash(i, 5) * 4], [102 - u * 82, y + 10]]);
  }
  const blush = o.blush ? [[-86, 16], [-94, 26], [-82, 28], [-90, 36], [-80, 34], [86, 16], [94, 26], [82, 28], [90, 36], [80, 34]] : null;
  return { contour, crease, eyeStrokes, browL: brow(-1), browR: brow(1), legL, legR, footL, footR, shade, blush };
}

// ── Из позы — raw-сел ─────────────────────────────────────────────────────────
function raw(p) {
  const strokes = [];
  const add = (id, points, width = 1.7, opacity = 1, extra = {}) => strokes.push({ id, points, width, opacity, pressure, ...extra });
  add('legL', p.legL, 2.1, .85, { corner: .9 });
  add('legR', p.legR, 2.1, .85, { corner: .9 });
  add('footL', p.footL, 2.2, .95, { corner: 1 });
  add('footR', p.footR, 2.2, .95, { corner: 1 });
  add('contour', p.contour, 2.1, .97, { corner: .8 });
  add('crease', p.crease, 1.9, .92);
  add('contour/search', p.contour.slice(2, 9).map(([x, y], i) => [x + 2 - i * .2, y - 3]), .75, .25);
  for (const s of p.eyeStrokes) {
    const round = s.id.startsWith('eye') || s.id.startsWith('pupil');
    add(s.id, s.pts, s.id.startsWith('lid') ? 1.9 : 1.5, s.id.startsWith('lid') ? .98 : round ? .8 : 1, round ? { corner: 1 } : {});
  }
  p.eyeStrokes.filter(s => s.id.startsWith('pupil')).forEach((s, i) => {
    const a = s.pts[1]; add('glint' + i, [[a[0] - 3, a[1] - 6], [a[0] + 1, a[1] - 8]], .8, .55);
  });
  add('browL', p.browL, 1.8, .9); add('browR', p.browR, 1.8, .9);
  p.shade.forEach((s, i) => add('shade/' + i, s, .6 + (i % 3) * .15, .3 + (i % 2) * .1));
  if (p.blush) { add('blushL', p.blush.slice(0, 5), 1.1, .5); add('blushR', p.blush.slice(5), 1.1, .5); }
  return { strokes };
}

// ── Ключевые позы ─────────────────────────────────────────────────────────────
const K = {
  rest:    pose({}),
  blink:   pose({ eyes: 'shut' }),
  glanceL: pose({ pupil: [-5, 1], brows: 'up' }),
  glanceR: pose({ pupil: [5, 1], brows: 'up' }),
  strain1: pose({ q: .4, clench: .3, eyes: 'open', pupil: [0, 2], brows: 'knit' }),
  strain2: pose({ q: .8, clench: .8, eyes: 'shut', brows: 'knit' }),
  strain2b: pose({ q: .84, clench: .95, eyes: 'shut', brows: 'knit' }),
  blast:   pose({ q: -.35, eyes: 'wide', brows: 'up', legs: 'dangle' }),
  apex:    pose({ q: .1, eyes: 'open', pupil: [0, 6], brows: 'up', legs: 'tuck' }),
  drop:    pose({ q: -.15, eyes: 'wide', brows: 'up', legs: 'dangle' }),
  dropB:   pose({ q: -.1, eyes: 'wide', pupil: [0, 4], brows: 'up', legs: 'dangle' }),
  squash:  pose({ q: 1, clench: .4, eyes: 'shut', brows: 'knit', legs: 'splay' }),
  recover: pose({ q: -.25, eyes: 'open', brows: 'up' }),
  settle:  pose({ q: .05, eyes: 'open', brows: 'relax' }),
  proud:   pose({ q: -.05, eyes: 'happy', brows: 'up', blush: true }),
  proudB:  pose({ q: -.02, eyes: 'happy', brows: 'up', blush: true }),
  enc:     pose({ q: .25, clench: .3, eyes: 'happy', brows: 'knit', blush: true }),
  gasp:    pose({ q: -.1, eyes: 'wide', brows: 'up', blush: true }),
  oops:    pose({ q: .15, eyes: 'wide', pupil: [0, 2], brows: 'up', blush: true }),
  oopsL:   pose({ q: .15, eyes: 'wide', pupil: [-8, 0], brows: 'up', blush: true }),
  oopsR:   pose({ q: .15, eyes: 'wide', pupil: [8, 0], brows: 'up', blush: true }),
  watch2:  pose({ q: .05, eyes: 'wide', pupil: [9, 6], brows: 'up', blush: true }),
};
const keyRaw = Object.fromEntries(Object.entries(K).map(([id, p]) => [id, raw(p)]));

// ── Облака: единый фестончатый силуэт (не «шарики»), пыль, какашка, волны ────
function scallopPts(nb, w, h) {
  const pts = [], N = nb * 4;
  for (let k = 0; k <= N; k++) {
    const u = k / N, b = Math.abs(Math.sin(u * Math.PI * nb)) ** .8;
    pts.push([-w / 2 + u * w, -h * (.09 + .41 * b) - Math.sin(u * Math.PI) * h * .18]);
  }
  for (let k = 1; k <= 3; k++) {
    const u = 1 - k / 4;
    pts.push([-w / 2 + u * w, h * (.30 + .10 * Math.sin(u * 9))]);
  }
  return pts;
}
function cloudCel(w, h, nb, id) {
  const strokes = [{ id: 'puff', points: scallopPts(nb, w, h), width: 1.8, opacity: .92, pressure, corner: 1.25, close: true }];
  if (w > 80) strokes.push(
    { id: 'd1', points: [[-w * .26, -h * .08], [-w * .15, -h * .2], [-w * .05, -h * .1]], width: 1.1, opacity: .45, pressure },
    { id: 'd2', points: [[w * .08, -h * .12], [w * .2, -h * .22], [w * .3, -h * .08]], width: 1.1, opacity: .45, pressure });
  return compileCel({ strokes }, { id });
}
const CLOUD = {
  burst1: cloudCel(150, 92, 3, 'cloud-b1'),
  burst2: cloudCel(220, 118, 4, 'cloud-b2'),
  burst3: cloudCel(300, 140, 5, 'cloud-b3'),
  puff1: cloudCel(72, 52, 2, 'puff1'),
  puff2: cloudCel(104, 64, 3, 'puff2'),
  puff3: cloudCel(132, 66, 3, 'puff3'),
};
const DUST = (() => {
  const mk = (r, a) => compileCel({ strokes: (() => { const p = []; const n = 14; for (let k = 0; k < n; k++) { const t = k / n * Math.PI - Math.PI; p.push({ id: 'd/' + k, points: [[Math.cos(t) * r, 24 + Math.sin(t) * r * .3], [Math.cos(t) * (r + 14), 24 + Math.sin(t) * r * .3 - 4]], width: 1.4, opacity: a, pressure }); } return p; })() }, { id: 'dust' + r });
  return { r1: mk(60, .7), r2: mk(110, .4) };
})();
// Какашка: мягкая порция. fly — вытянутая в полёте, land — нормальная, squash — сплющенная при посадке.
function poopCel(kind) {
  const s = [];
  const blob = (bid, cx, cy, rx, ry) => { const p = []; for (let k = 0; k <= 7; k++) { const a = -Math.PI / 2 + k * Math.PI * 2 / 7; p.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); } p.push(p[0].slice()); s.push({ id: bid, points: p, width: 1.8, opacity: .95, pressure }); };
  if (kind === 'fly') {
    blob('b1', 0, -6, 18, 34);
    s.push({ id: 'curl', points: [[-5, -38], [1, -52], [10, -48], [14, -37]], width: 1.5, opacity: .85, pressure });
  } else {
    const sqx = kind === 'squash' ? 1.25 : 1, sy = kind === 'squash' ? .7 : 1;
    blob('b1', 0, -3 * sy, 30 * sqx, 13 * sy);
    blob('b2', 0, -17 * sy, 22 * sqx, 12 * sy);
    blob('b3', -1, -30 * sy, 14, 9);
    s.push({ id: 'curl', points: [[-8, -37], [1, -48], [11, -44], [14, -34]], width: 1.5, opacity: .85, pressure });
    for (let i = 0; i < 4; i++) s.push({ id: 'spk' + i, points: [[-17 + i * 11, -9 + (i % 2) * 9], [-14 + i * 11, -4 + (i % 2) * 9]], width: .8, opacity: .4, pressure });
    if (kind === 'land') s.push({ id: 'ground', points: [[-30, 8], [-10, 11], [12, 10], [30, 6]], width: .9, opacity: .45, pressure });
  }
  return compileCel({ strokes: s }, { id: 'poop-' + kind });
}
const POOP = { fly: poopCel('fly'), land: poopCel('land'), squash: poopCel('squash') };
const STINK = {
  A: compileCel({ strokes: [0, 1, 2].map(k => ({ id: 'w' + k, points: [[-18 + k * 18, 26], [-18 + k * 18 + (k % 2 ? -6 : 6), 8], [-18 + k * 18 + (k % 2 ? 5 : -5), -10], [-18 + k * 18 + (k - 1) * 6, -30]], width: 1.7, opacity: .75, pressure })) }, { id: 'stink-a' }),
  B: compileCel({ strokes: [0, 1, 2].map(k => ({ id: 'w' + k, points: [[-18 + k * 18, 26], [-18 + k * 18 + (k % 2 ? 7 : -7), 8], [-18 + k * 18 + (k % 2 ? -6 : 6), -10], [-18 + k * 18 + (k - 1) * -6, -30]], width: 1.7, opacity: .75, pressure })) }, { id: 'stink-b' }),
};
// Птица-уборщик: круглая голова с клювом, веерный хвост, длинное крыло; нос на -x
const BIRD = (() => {
  const body = [[-16, -2], [-8, -12], [6, -15], [18, -10], [25, -1], [21, 8], [6, 12], [-10, 9]];
  const head = [[-22, -26], [-14, -21], [-11, -13], [-15, -6], [-23, -5], [-29, -12], [-28, -22]];
  const beak = [[-29, -17], [-46, -11], [-28, -6]];
  const eye = [[-22, -20], [-19, -17], [-22, -14], [-25, -17], [-22, -20]];
  const tail = [[24, -5], [42, -13], [48, -7], [48, 3], [43, 10], [25, 5], [24, -5]];
  const tf1 = [[28, -4], [43, -8]], tf2 = [[28, 2], [43, 3]];
  const wings = {
    up:   { m: [[2, -6], [-10, -26], [-28, -42], [-42, -46]], f: [[-22, -34], [-36, -41]] },
    mid:  { m: [[2, -6], [-12, -16], [-30, -20], [-46, -17]], f: [[-24, -17], [-38, -18]] },
    down: { m: [[2, -6], [-6, 6], [-16, 20], [-28, 30]],      f: [[-12, 15], [-24, 25]] },
  };
  return Object.fromEntries(Object.entries(wings).map(([k, w]) => [k, compileCel({ strokes: [
    { id: 'body', points: body, width: 1.9, opacity: .95, pressure, corner: .9 },
    { id: 'head', points: head, width: 1.9, opacity: .95, pressure, corner: 1.2 },
    { id: 'beak', points: beak, width: 1.8, opacity: .95, pressure, corner: .5 },
    { id: 'eye', points: eye, width: 1.4, opacity: .9, pressure, close: true },
    { id: 'tail', points: tail, width: 1.7, opacity: .9, pressure, corner: .8, close: true },
    { id: 'tf1', points: tf1, width: 1.2, opacity: .6, pressure },
    { id: 'tf2', points: tf2, width: 1.2, opacity: .6, pressure },
    { id: 'wing', points: w.m, width: 2.2, opacity: .95, pressure },
    { id: 'wf', points: w.f, width: 1.2, opacity: .6, pressure },
  ] }, { id: 'bird-' + k })]));
})();

// ── Экспозиционный лист ───────────────────────────────────────────────────────
const D = {}, entries = [], placements = {}, at = {};
let FR = 0;
const put = (id, cel, frames, x = 0, y = 0) => { D[id] = compileCel(cel, { id }); placements[id] = [x, y]; entries.push({ id, frames }); at[id] = FR / 24; FR += frames; };
function passage(a, b, spacing, frames = 2) {
  for (const [i, u] of spacing.entries()) put(a + '-' + b + '-' + i, inbetweenCel(keyRaw[a], keyRaw[b], u), frames, lerp(0, 0, u), lerp(placements[a]?.[1] || 0, placements[b]?.[1] || 0, u));
}
// Акт I: осматривается
put('rest', keyRaw.rest, 14);
put('blink', keyRaw.blink, 3);
put('rest2', keyRaw.rest, 8);
passage('rest', 'glanceL', [.3, .7]); put('glanceL', keyRaw.glanceL, 9);
passage('glanceL', 'glanceR', [.5]); put('glanceR', keyRaw.glanceR, 8);
// Акт II: напрягается (глаза открыты → зажмуривание — режиссёрский cut)
passage('glanceR', 'strain1', [.2, .5, .8]); put('strain1', keyRaw.strain1, 7);
put('strain2', keyRaw.strain2, 4);                       // eyeslam
put('strain2b', keyRaw.strain2b, 2); put('strain2', keyRaw.strain2, 2);
put('strain2b', keyRaw.strain2b, 2); put('strain2', keyRaw.strain2, 2);
put('strain2b', keyRaw.strain2b, 2);                     // тряска
// ПУК! → взлёт как ракета (размещение корня — часть каждого exposure)
put('blast', keyRaw.blast, 2, 0, -30);
put('rise1', inbetweenCel(keyRaw.blast, keyRaw.apex, .3), 2, 0, -110);
put('rise2', inbetweenCel(keyRaw.blast, keyRaw.apex, .62), 2, 0, -196);
put('rise3', inbetweenCel(keyRaw.blast, keyRaw.apex, .82), 1, 0, -290);
put('apex', keyRaw.apex, 2, 0, -342);
put('apex2', keyRaw.apex, 7, 0, -368);                   // зависание — верх кадра
put('apex3', keyRaw.apex, 3, 0, -352);
// падение с ускорением, ноги болтаются
put('drop', keyRaw.drop, 1, 0, -280); put('dropB', keyRaw.dropB, 1, 0, -196);
put('drop', keyRaw.drop, 1, 0, -108); put('dropB', keyRaw.dropB, 1, 0, -30);
put('drop', keyRaw.drop, 1, 0, 26);
put('squash', keyRaw.squash, 5, 0, 44);                  // ШЛЁП
put('recover', keyRaw.recover, 2, 0, -6);                // пружина
passage('recover', 'settle', [.4, .75]); put('settle', keyRaw.settle, 6);
// Акт III: гордость → бис → обкакалась
put('proud', keyRaw.proud, 8);                           // сияет
put('proudB', keyRaw.proudB, 2, 0, -8); put('proud2', keyRaw.proud, 6);
passage('proud', 'enc', [.5]); put('enc', keyRaw.enc, 5); // «ещё разок, миленько»
put('push1', keyRaw.strain1, 3);                         // тужится уверенно
put('push2', keyRaw.strain2, 3);                         // зажмурилась
put('push2b', keyRaw.strain2b, 2); put('push2c', keyRaw.strain2, 2);
put('gasp', keyRaw.gasp, 3);                             // ой. что-то не то
put('push3', keyRaw.strain2b, 3);                        // из последних сил
put('oops', keyRaw.oops, 14);                            // PLOP. шок.
put('oopsL', keyRaw.oopsL, 4); put('oopsR', keyRaw.oopsR, 4); // никто не видел?
put('oops2', keyRaw.oops, 12);                           // смущение, воняет
put('watchR', keyRaw.oopsR, 20);                         // птица! справа, слетается
put('watch2', keyRaw.watch2, 20);                        // следит взглядом вверх
put('restEnd', keyRaw.rest, 12);                         // снова покой → цикл замкнут
const SHEET = exposureSheet(entries, D, 24);
const DUR = SHEET.duration;

// ── Земля (стабильный сел) ────────────────────────────────────────────────────
const ground = { strokes: [] };
const gl = (id, points, width, opacity = .7) => ground.strokes.push({ id, points, width, opacity, pressure });
gl('ground', [[-860, 132], [-540, 128], [-180, 131], [190, 129], [560, 132], [870, 126]], 2.4, .9);
gl('ground/2', [[-820, 141], [-430, 138], [-60, 140], [330, 138], [740, 140]], 1.2, .5);
for (let i = 0; i < 9; i++) {
  const x = -760 + i * 190 + hash(i, 11) * 60;
  gl('grass/' + i, [[x, 130], [x - 4 + hash(i, 2) * 8, 112 - hash(i, 4) * 10], [x + 3, 106 - hash(i, 6) * 8]], 1.1, .55);
  gl('grass2/' + i, [[x + 14, 130], [x + 18, 116 - hash(i, 8) * 8], [x + 24, 110]], .8, .4);
}
gl('stone', [[420, 130], [434, 118], [452, 116], [462, 128], [448, 132], [428, 132]], 1.2, .5);
const GROUND = compileCel(ground, { id: 'ground-stable' });

// ── Спрайты: конечный набор селов, кэш по look/scale/color ───────────────────
const sprites = new Map();
const M = id => id === 'ground' ? { w: 1800, h: 340, ox: 900, oy: 170 } : { w: 560, h: 520, ox: 280, oy: 200 };
function sprite(id, color = INK) {
  const key = LOOK + '/' + S + '/' + id + '/' + color;
  if (!sprites.has(key)) {
    const m = M(id), cv = document.createElement('canvas');
    cv.width = Math.ceil(m.w * S * 1.9); cv.height = Math.ceil(m.h * S * 1.9);
    const g = cv.getContext('2d');
    g.scale(S * 1.9, S * 1.9); g.translate(m.ox, m.oy);
    const which = id === 'ground' ? GROUND : id.startsWith('cloud:') ? CLOUD[id.slice(6)] : id.startsWith('dust:') ? DUST[id.slice(5)] : id.startsWith('poop:') ? POOP[id.slice(5)] : id.startsWith('stink:') ? STINK[id.slice(6)] : id.startsWith('bird:') ? BIRD[id.slice(5)] : D[id];
    drawCel(g, which, { material: LOOK, color });
    sprites.set(key, cv);
  }
  return sprites.get(key);
}
const drawSpr = (c, id, x = 0, y = 0, alpha = 1, color = INK, flip = false) => {
  const s = sprite(id, color), m = M(id);
  c.save(); c.globalAlpha = alpha;
  if (flip) { c.translate(x, y); c.scale(-1, 1); c.drawImage(s, -m.ox * 1.9, -m.oy * 1.9, s.width / S, s.height / S); }
  else c.drawImage(s, x - m.ox * 1.9, y - m.oy * 1.9, s.width / S, s.height / S);
  c.restore();
};

// ── Времена событий ───────────────────────────────────────────────────────────
const T = {
  blast: at.blast, apex: at.apex2, fall: at.drop, splat: at.squash,
  poop: at.oops, bird: at.watchR, grab: at.watchR + .85, end: DUR,
};

// ── Сцена ─────────────────────────────────────────────────────────────────────
function shot(c, tau) {
  paper(c, '#f5f0e5', null, 87);
  const rootX = CX, rootY = CY + GY_PLACE, groundY = rootY + 132;
  drawSpr(c, 'ground', rootX, rootY); // линии земли в локальных y≈130 селa
  // облако-выхлоп при пуке
  const bt = tau - T.blast;
  if (bt >= 0 && bt < .8) {
    const u = bt / .8;
    drawSpr(c, 'cloud:' + (u < .28 ? 'burst1' : u < .6 ? 'burst2' : 'burst3'), rootX, rootY + 72, u < .6 ? 1 : 1 - (u - .6) / .4);
  }
  // выхлопные пуфы вдоль взлёта
  if (bt >= .12 && bt < 1.1) {
    for (let k = 0; k < 3; k++) {
      const t0 = .12 + k * .16, age = bt - t0;
      if (age < 0 || age > .5) continue;
      const yy = rootY - 20 - (t0 / .6) * 340;
      drawSpr(c, 'cloud:' + (age < .18 ? 'puff1' : age < .34 ? 'puff2' : 'puff3'), rootX + (k % 2 ? 26 : -26), yy + 60, 1 - age / .5);
    }
  }
  // шлепок: кольцо пыли + пуфы
  const st = tau - T.splat;
  if (st >= 0 && st < .55) {
    if (st < .3) drawSpr(c, 'dust:' + (st < .15 ? 'r1' : 'r2'), rootX, rootY + 40, 1 - st / .3);
    if (st < .4) { drawSpr(c, 'cloud:' + (st < .18 ? 'puff2' : 'puff3'), rootX - 60, rootY + 90, 1 - st / .4); drawSpr(c, 'cloud:' + (st < .18 ? 'puff2' : 'puff3'), rootX + 64, rootY + 90, 1 - st / .4); }
  }
  // какашка: выскакивает из-под неё, дуга, площ, лежит — пока птица не унесёт
  const pt = tau - T.poop;
  if (pt >= 0 && tau < T.grab) {
    const kf = [[0, 150, -40, 'fly'], [.04, 240, -142, 'fly'], [.09, 290, -98, 'fly'], [.13, 320, -42, 'fly'], [.17, 326, -6, 'squash'], [.26, 324, -8, 'land'], [1e9, 324, -8, 'land']];
    let x = 324, y = -8, cid = 'land';
    for (const [t0, kx, ky, kc] of kf) if (pt >= t0) { x = kx; y = ky; cid = kc; }
    drawSpr(c, 'poop:' + cid, rootX + x, groundY + y, 1, POOP_INK);
    if (pt >= .13 && pt < .3) drawSpr(c, 'cloud:puff1', rootX + x, groundY - 4, 1 - (pt - .13) / .17); // пыльница при посадке
    // вонючие волны — смена двух селов на двоечках; гаснут, когда птица хватает
    if (pt > .55) {
      const a = sm(.55, 1.1, pt) * .9 * Math.max(0, 1 - Math.max(0, tau - (T.grab - .12)) / .25);
      drawSpr(c, 'stink:' + (Math.floor(pt * 8) % 2 ? 'A' : 'B'), rootX + x, groundY + y - 26, a, STINK_INK);
    }
  }
  // персонаж
  const q = SHEET.at(tau), [px, py] = placements[q.id];
  drawSpr(c, q.id, rootX + px, rootY + py);
  // птица-уборщик: слетает справа, хватает какашку, уносит вверх-вправо за кадр
  const tb = tau - T.bird, TG = .85, TE = 2.05;
  if (tb >= 0 && tb < TE) {
    const gx = rootX + 324, gy = groundY - 40; // точка хватки
    let bx, by, flip;
    if (tb < TG) {
      const u = tb / TG;
      bx = rootX + 1000 + (gx - rootX - 1000) * easeIO(u);
      by = groundY - 620 + (gy - groundY + 620) * easeIO(u) - Math.sin(u * Math.PI) * 70;
      flip = false; // летит влево
    } else {
      const v = (tb - TG) / (TE - TG);
      bx = gx + (rootX + 1050 - gx) * (v * .7 + v * v * .3);
      by = gy + (groundY - 1050 - gy) * easeOut(v) - Math.sin(v * Math.PI) * 26 + Math.sin(v * 9) * 5;
      flip = true; // уносит вправо-вверх
    }
    const flap = ['up', 'mid', 'down', 'mid'][Math.floor(tb * 9) % 4];
    if (tb >= TG) drawSpr(c, 'poop:land', bx + 4, by + 46, 1, POOP_INK, flip);
    drawSpr(c, 'bird:' + flap, bx, by, 1, INK, flip);
  }
}
const GY_PLACE = 260 - 132; // корень персонажа: local y=0 → мировая линия земли на CY+260
defineFilm({
  palette: { ...PALETTES.pencilMinimal, paper: '#f5f0e5' },
  format: { ar: '16:9', width: 1920 }, fps: 24,
  timeline: [{ name: 'puk', dur: DUR, fn: shot }],
  score,
});

// Автоплей: стартуем сразу и без звука (браузеры требуют жест для аудио —
// кнопка «sound: off» в панели включает его настоящим кликом). Плеер лупит сам.
if (!location.search.includes('bare'))
  setTimeout(() => { const b = document.getElementById('play'); if (b && b.textContent === 'play') b.click(); }, 80);

// Живой звук, синхронный с циклом. Штатный плеер играет score лишь один раз
// и только если звук был включён ДО нажатия play. Вместо спрятанной в панели
// кнопки: (1) пробуем включить звук сразу — если браузер разрешает, посетитель
// не видит ничего лишнего; (2) иначе показываем fixed-плашку «включить звук»
// поверх кадра и включаем звук первым же кликом/тапом в любом месте страницы.
// Ручное выключение в панели уважается (авто больше не возвращает звук).
// Score перепланируется по аудио-часам на каждом витке; включение звука
// перезапускает цикл с нуля, чтобы звук и картинка шли вместе.
(() => {
  if (location.search.includes('bare')) return;
  const playBtn = document.getElementById('play'), sndBtn = document.getElementById('snd'), scrub = document.getElementById('scrub');
  if (!playBtn || !sndBtn || !scrub) return;
  const hint = document.createElement('button');
  hint.textContent = 'включить звук';
  hint.style.cssText = 'position:fixed;top:14px;right:14px;z-index:9;background:#f5f0e5;color:#423930;border:2px solid #423930;border-radius:10px;padding:8px 16px;font:600 15px system-ui,sans-serif;cursor:pointer;box-shadow:2px 3px 0 rgba(66,57,48,.35)';
  document.body.appendChild(hint);
  let ac = null, feed = null, timer = null, nextT0 = 0, on = false, userMuted = false;
  const playing = () => playBtn.textContent === 'pause';
  const kill = () => { if (feed) { try { feed.disconnect(); } catch (e) {} } feed = null; if (timer) { clearInterval(timer); timer = null; } };
  const schedule = t => { score(ac, t, feed); nextT0 = t + DUR; };
  const start = () => {
    kill(); if (!on || !ac) return;
    feed = ac.createGain(); feed.connect(ac.destination);
    schedule(ac.currentTime + .08);
    timer = setInterval(() => { if (nextT0 < ac.currentTime + DUR) schedule(nextT0); }, 250);
  };
  const setOn = v => { on = v; sndBtn.textContent = 'sound: ' + (on ? 'on' : 'off'); hint.style.display = on ? 'none' : ''; };
  const enable = () => {
    if (on) return;
    userMuted = false; setOn(true);
    ac = ac || new AudioContext();
    ac.resume().then(() => { if (playing()) { playBtn.click(); playBtn.click(); } else start(); }); // рестарт цикла вместе со звуком
  };
  sndBtn.onclick = () => { if (on) { userMuted = true; setOn(false); kill(); } else enable(); };
  hint.onclick = () => enable();
  playBtn.addEventListener('click', () => { if (playing()) { if (on && ac) start(); } else kill(); });
  scrub.addEventListener('input', kill);
  // любой первый клик/тап/клавиша вне панели плеера включает звук
  const wake = e => { if (!on && !userMuted && !(e.target.closest && e.target.closest('.bar'))) enable(); };
  addEventListener('pointerdown', wake);
  addEventListener('keydown', wake);
  // попытка честного автозвука: повторным посетителям/разрешающим браузерам можно
  setTimeout(async () => {
    try {
      ac = ac || new AudioContext();
      await Promise.race([ac.resume(), new Promise(r => setTimeout(r, 400))]);
      if (ac.state === 'running' && !on && !userMuted) enable();
    } catch (e) {}
  }, 350);
})();

// ── Саундтрек ─────────────────────────────────────────────────────────────────
function score(ac, t0, dest) {
  const master = ac.createGain(); master.gain.setValueAtTime(.72, t0); master.gain.setValueAtTime(.72, t0 + DUR - .6); master.gain.linearRampToValueAtTime(0, t0 + DUR);
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 20; comp.ratio.value = 2.6; comp.attack.value = .015; comp.release.value = .25;
  master.connect(comp); comp.connect(dest);
  const hz = n => 440 * 2 ** ((n - 69) / 12);
  const send = (node, pan = 0) => { const p = ac.createStereoPanner(); p.pan.value = pan; node.connect(p); p.connect(master); };
  function fart(t, f0, f1, d, vol, wobbleHz = 10) {
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0, t0 + t);
    o.frequency.exponentialRampToValueAtTime(f1, t0 + t + d);
    const lfo = ac.createOscillator(), lg = ac.createGain();
    lfo.frequency.value = wobbleHz; lg.gain.value = f0 * .45;
    lfo.connect(lg); lg.connect(o.frequency);
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(420, t0 + t); f.frequency.exponentialRampToValueAtTime(220, t0 + t + d); f.Q.value = 2.5;
    const e = ac.createGain();
    e.gain.setValueAtTime(0, t0 + t); e.gain.linearRampToValueAtTime(vol, t0 + t + .03);
    e.gain.setValueAtTime(vol, t0 + t + d * .55); e.gain.exponentialRampToValueAtTime(.0008, t0 + t + d);
    o.connect(f); f.connect(e); send(e); o.start(t0 + t); o.stop(t0 + t + d + .05); lfo.start(t0 + t); lfo.stop(t0 + t + d + .05);
    noiseBurst(ac, master, t0, t, d * .8, vol * .35, 42);
  }
  function whistle(t, n0, n1, d, vol) {
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(hz(n0), t0 + t); o.frequency.exponentialRampToValueAtTime(hz(n1), t0 + t + d);
    const e = ac.createGain(); e.gain.setValueAtTime(0, t0 + t); e.gain.linearRampToValueAtTime(vol, t0 + t + .04); e.gain.exponentialRampToValueAtTime(.0008, t0 + t + d);
    o.connect(e); send(e, .1); o.start(t0 + t); o.stop(t0 + t + d + .05);
  }
  function thump(t, vol) {
    const o = ac.createOscillator(); o.frequency.setValueAtTime(96, t0 + t); o.frequency.exponentialRampToValueAtTime(36, t0 + t + .18);
    const e = ac.createGain(); e.gain.setValueAtTime(vol, t0 + t); e.gain.exponentialRampToValueAtTime(.0008, t0 + t + .5);
    o.connect(e); send(e); o.start(t0 + t); o.stop(t0 + t + .55);
    noiseBurst(ac, master, t0, t, .3, vol * .5, 77);
  }
  function plunk(t) {
    const o = ac.createOscillator(); o.frequency.setValueAtTime(460, t0 + t); o.frequency.exponentialRampToValueAtTime(150, t0 + t + .13);
    const e = ac.createGain(); e.gain.setValueAtTime(.3, t0 + t); e.gain.exponentialRampToValueAtTime(.0008, t0 + t + .16);
    o.connect(e); send(e, .15); o.start(t0 + t); o.stop(t0 + t + .2);
    noiseBurst(ac, master, t0, t, .12, .18, 78);
  }
  const pluck = (n, t, vol = .16) => note(ac, master, hz(n), t0, t, .5, 'triangle', vol);
  function drone(tA, tB, f0, f1, vol) {
    const o = ac.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(f0, t0 + tA); o.frequency.linearRampToValueAtTime(f1, t0 + tB);
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 13; lg.gain.value = 4; lfo.connect(lg); lg.connect(o.frequency);
    const e = ac.createGain(); e.gain.setValueAtTime(0, t0 + tA); e.gain.linearRampToValueAtTime(vol, t0 + tB);
    o.connect(e); send(e); o.start(t0 + tA); o.stop(t0 + tB + .02); lfo.start(t0 + tA); lfo.stop(t0 + tB + .02);
  }
  function boing(t) {
    for (let k = 0; k < 4; k++) {
      const o = ac.createOscillator(); o.type = 'sine';
      const f = 240 - k * 30, t1 = t + k * .09;
      o.frequency.setValueAtTime(f, t0 + t1); o.frequency.exponentialRampToValueAtTime(f * 1.8, t0 + t1 + .07);
      const e = ac.createGain(); e.gain.setValueAtTime(0, t0 + t1); e.gain.linearRampToValueAtTime(.09, t0 + t1 + .01); e.gain.exponentialRampToValueAtTime(.0008, t0 + t1 + .1);
      o.connect(e); send(e, -.2); o.start(t0 + t1); o.stop(t0 + t1 + .15);
    }
  }
  function wah(t, f0, f1, d) { // грустный тромбон
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0, t0 + t); o.frequency.linearRampToValueAtTime(f1, t0 + t + d);
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
    const e = ac.createGain(); e.gain.setValueAtTime(0, t0 + t); e.gain.linearRampToValueAtTime(.11, t0 + t + .05); e.gain.setValueAtTime(.11, t0 + t + d * .7); e.gain.exponentialRampToValueAtTime(.0008, t0 + t + d);
    o.connect(f); f.connect(e); send(e, -.1); o.start(t0 + t); o.stop(t0 + t + d + .05);
  }
  // I: осматривается
  pluck(69, at.glanceL + .1); pluck(74, at.glanceR + .1);
  // II: напряжение → ПУК (трёхколенный салют) → ракета
  drone(at.strain1 - .3, T.blast, 52, 88, .14);
  fart(T.blast + .02, 92, 55, .28, .5, 16);
  fart(T.blast + .30, 110, 48, .5, .62, 12);
  fart(T.blast + .78, 70, 34, .65, .5, 9);
  whistle(T.blast + .35, 62, 90, .8, .07);
  { const hiss = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * .9), ac.sampleRate), ch = buf.getChannelData(0), r = rng(9);
    for (let i = 0; i < ch.length; i++) ch[i] = (r() * 2 - 1) * Math.sin(Math.PI * i / ch.length);
    hiss.buffer = buf; f.type = 'bandpass'; f.frequency.setValueAtTime(1800, t0 + T.blast + .3); f.frequency.exponentialRampToValueAtTime(500, t0 + T.blast + 1.2); f.Q.value = .8;
    g.gain.value = .09; hiss.connect(f); f.connect(g); send(g); hiss.start(t0 + T.blast + .3); }
  note(ac, master, hz(81), t0, T.apex + .35, .25, 'sine', .06); // «ой» в невесомости
  whistle(T.fall - .1, 88, 40, .75, .09);
  thump(T.splat, .5);
  fart(T.splat + .18, 190, 130, .14, .2, 22); // писк-пук при шлепке
  boing(T.splat + .45);
  // III: гордость → бис-катастрофа
  pluck(72, at.proud + .1, .18); pluck(76, at.proud + .28, .18); pluck(79, at.proud + .5, .2);
  // «ещё разок» — уверенно тужится... тишина (комедийная пауза)
  drone(at.push1, T.poop - .05, 55, 78, .11);
  fart(T.poop - .06, 80, 50, .16, .32, 14);  // бррр
  plunk(T.poop + .06);                        // PLOP
  thump(T.poop + .06, .22);
  note(ac, master, hz(84), t0, at.oopsL + .05, .3, 'sine', .05); // судорожный вдох
  wah(at.oops2 + .02, 196, 185, .5);          // ва…
  wah(at.oops2 + .38, 174, 156, .62);         // …аа
  // птица-уборщик: неспешный трепет крыльев + чирики
  for (let k = 0; k < 16; k++) noiseBurst(ac, master, t0, T.bird + .04 + k * .13, .07, k % 2 ? .05 : .038, 60 + k);
  note(ac, master, 1568, t0, T.grab, .07, 'sine', .07);
  note(ac, master, 2093, t0, T.grab + .12, .08, 'sine', .05);
  note(ac, master, 1760, t0, T.grab + .55, .1, 'sine', .05);
  note(ac, master, 1976, t0, T.grab + 1.3, .09, 'sine', .045);
}
</script>
